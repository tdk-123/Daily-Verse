<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Verse</title>

  <!-- PWA setup -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#EFEAE0" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <div class="top-bar">
      <p class="app-label" id="appLabel">Daily Verse</p>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="flag-btn active" data-language="EN" aria-pressed="true" title="English">🇬🇧</button>
        <button class="flag-btn" data-language="NL" aria-pressed="false" title="Nederlands">🇳🇱</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <p class="control-label" id="testamentLabel">Testament</p>
        <div class="btn-row" role="group" aria-label="Choose testament">
          <button class="pill-btn active" data-testament="OT" aria-pressed="true">Old Testament</button>
          <button class="pill-btn active" data-testament="NT" aria-pressed="true">New Testament</button>
        </div>
      </div>

      <div class="control-group">
        <p class="control-label" id="versionLabel">Version</p>
        <div class="btn-row" role="group" aria-label="Choose translation age">
          <button class="pill-btn" data-version="OLD" aria-pressed="false">Old</button>
          <button class="pill-btn active" data-version="MODERN" aria-pressed="true">Modern</button>
        </div>
      </div>
    </div>

    <p class="selection-error" id="selectionError" hidden></p>

    <button class="new-verse-btn" id="newVerseBtn">Give me a random verse</button>

    <section class="verse-card" id="verseCard" aria-live="polite">
      <p class="verse-state" id="verseState">Choose your options, then tap the button above.</p>

      <blockquote class="verse-text" id="verseText" hidden></blockquote>
      <p class="verse-ref" id="verseRef" hidden></p>
      <p class="translation-label" id="translationLabel" hidden></p>
    </section>

    <section class="commentary" id="commentarySection" hidden>
      <p class="commentary-label" id="commentaryLabel">Context</p>
      <p class="commentary-text" id="commentaryText"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
