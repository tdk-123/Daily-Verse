<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Verse</title>

  <!-- PWA setup -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#EFEAE0" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <p class="app-label">Daily Verse</p>

    <div class="testament-select" role="group" aria-label="Choose testament">
      <button class="testament-btn active" data-testament="ALL" aria-pressed="true">Whole Bible</button>
      <button class="testament-btn" data-testament="OT" aria-pressed="false">Old Testament</button>
      <button class="testament-btn" data-testament="NT" aria-pressed="false">New Testament</button>
    </div>

    <section class="verse-card" id="verseCard" aria-live="polite">
      <p class="verse-state" id="verseState">Finding a verse for you…</p>

      <blockquote class="verse-text" id="verseText" hidden></blockquote>
      <p class="verse-ref" id="verseRef" hidden></p>
    </section>

    <section class="commentary" id="commentarySection" hidden>
      <p class="commentary-label">Context</p>
      <p class="commentary-text" id="commentaryText"></p>
    </section>

    <button class="new-verse-btn" id="newVerseBtn">New verse</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
